name: Test Backend

on:
  push:
    branches:
      - just-scrapping
  pull_request:
    branches:
      - just-scrapping
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax and app checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Import FastAPI application
        env:
          APP_NAME: Job Auto Apply
          APP_ENV: test
          REDIS_URL: redis://localhost:6379
          BACKEND_HOST: 0.0.0.0
          BACKEND_PORT: 8004
          DATABASE_URL: ""
        run: python -c 'from app.main import app; print(app.title)'
        working-directory: backend

      - name: Run backend unit tests
        env:
          APP_NAME: Job Auto Apply
          APP_ENV: test
          REDIS_URL: redis://localhost:6379
          BACKEND_HOST: 0.0.0.0
          BACKEND_PORT: 8004
          DATABASE_URL: ""
        run: |
          python -m unittest test_alert_scheduler.py
          python -m unittest test_alert_execution.py
          python -m unittest test_alert_email.py
          python -m unittest test_viewed_jobs.py
          python -m unittest test_payment_quota_upgrade.py
          python -m unittest test_api_performance.py
        working-directory: backend
