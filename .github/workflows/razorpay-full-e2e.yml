name: Razorpay Full E2E Test

on:
  workflow_dispatch:
  push:
    branches: [just-scrapping]
    paths:
      - ".github/workflows/razorpay-full-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jobs.n8npi.live
      CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}

    steps:
      - name: Wait for backend
        run: |
          set -Eeuo pipefail
          for i in {1..60}; do
            code=$(curl -sS --http1.1 --max-time 10 -o /tmp/health -w '%{http_code}' "$BASE_URL/api/v1/health/database" || true)
            if [ "$code" = 200 ]; then cat /tmp/health; exit 0; fi
            sleep 3
          done
          exit 1

      - name: API and webhook checks
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/login" -w '%{http_code}' -X POST "$BASE_URL/api/v1/auth/login" -H 'Content-Type: application/json' --data "{\"email\":\"$CI_TEST_USER_EMAIL\",\"password\":\"$CI_TEST_USER_PASSWORD\"}")
          [ "$code" = 200 ]
          TOKEN=$(python - "$TMP/login" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['session']['access_token'])
          PY
          )
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/order" -w '%{http_code}' -X POST "$BASE_URL/api/v1/payments/orders" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"plan_code":"starter"}')
          [ "$code" = 200 ]
          python - "$TMP/order" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['plan_code']=='starter' and d['amount_inr_paise']==29900 and d['currency']=='INR'
          assert d['order_id'].startswith('order_') and d['razorpay_key_id'].startswith('rzp_test_')
          print('ORDER: PASS')
          PY
          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/webhook -w '%{http_code}' -X POST "$BASE_URL/api/v1/payments/webhook" -H 'Content-Type: application/json' -H 'X-Razorpay-Signature: invalid-signature' --data '{"id":"e2e-invalid","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_invalid","order_id":"order_invalid"}}}}')
          [ "$code" = 400 ]
          echo 'INVALID WEBHOOK SIGNATURE: PASS'

      - name: Install Playwright
        run: |
          set -Eeuo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Real Razorpay Test Checkout via UPI
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rzp
          cat >/tmp/rzp/test.js <<'NODE'
          const fs=require('fs'); const {chromium}=require('/tmp/node_modules/playwright');
          const base=process.env.BASE_URL,email=process.env.CI_TEST_USER_EMAIL,password=process.env.CI_TEST_USER_PASSWORD;
          async function api(path,opt={}){const r=await fetch(base+path,opt),t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}if(!r.ok)throw Error(`${path}: HTTP ${r.status} ${t}`);return d}
          (async()=>{
            const l=await api('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
            const token=l.session.access_token;
            const order=await api('/api/v1/payments/orders',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${token}`},body:JSON.stringify({plan_code:'starter'})});
            fs.writeFileSync('/tmp/rzp/index.html',`<!doctype html><button id="pay">Pay</button><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const o={key:${JSON.stringify(order.razorpay_key_id)},amount:${order.amount_inr_paise},currency:'INR',name:'Job Finder Test',description:'Test',order_id:${JSON.stringify(order.order_id)},prefill:{name:'CI Test User',email:${JSON.stringify(email)},contact:'+919999999999'},handler:r=>window.paymentResult=r};const rzp=new Razorpay(o);document.getElementById('pay').onclick=()=>rzp.open();</script>`);
            const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1280,height:900}});
            p.on('console',m=>console.log('browser:',m.text())); p.on('pageerror',e=>console.log('pageerror:',e.message));
            await p.goto('http://127.0.0.1:4173/index.html'); await p.getByRole('button',{name:'Pay'}).click();
            const frames=()=>p.frames().filter(f=>f.url().includes('razorpay')||f===p.mainFrame());
            let contact=null;
            for(let i=0;i<40&&!contact;i++){for(const f of frames()){try{const x=f.locator('input[placeholder="Mobile number"]').first();if(await x.count()&&await x.isVisible()){contact=x;break}}catch{}}if(!contact)await p.waitForTimeout(500)}
            if(!contact){await p.screenshot({path:'/tmp/rzp/contact.png',fullPage:true});throw Error('Razorpay contact mobile field not found')}
            await contact.fill('9999999999');
            let cont=null; for(const f of frames()){try{const x=f.getByRole('button',{name:/continue/i}).last();if(await x.count()&&await x.isVisible()){cont=x;break}}catch{}}
            if(!cont)throw Error('Razorpay contact Continue button not found'); await cont.click();
            let upi=null; for(let i=0;i<30&&!upi;i++){for(const f of frames()){try{const tab=f.getByText('UPI',{exact:true}).first();if(await tab.count()&&await tab.isVisible()){await tab.click();break}}catch{}}for(const f of frames()){for(const s of ['input[placeholder*="UPI" i]','input[name*="upi" i]','input[placeholder*="VPA" i]']){try{const x=f.locator(s).first();if(await x.count()&&await x.isVisible()){upi=x;break}}catch{}}if(upi)break}if(!upi)await p.waitForTimeout(500)}
            if(!upi){await p.screenshot({path:'/tmp/rzp/upi.png',fullPage:true});throw Error('Razorpay UPI input not found')}
            await upi.fill('success@razorpay');
            let pay=null; for(const f of frames()){for(const n of [/verify\s*and\s*pay/i,/pay/i,/proceed/i]){try{const x=f.getByRole('button',{name:n}).last();if(await x.count()&&await x.isVisible()){pay=x;break}}catch{}}if(pay)break}
            if(!pay){await p.screenshot({path:'/tmp/rzp/upi-before-pay.png',fullPage:true});throw Error('Razorpay UPI Pay button not found')} await pay.click();
            await p.waitForTimeout(3000); await p.screenshot({path:'/tmp/rzp/after-pay.png',fullPage:true});
            await p.waitForFunction(()=>!!window.paymentResult,null,{timeout:45000}); const result=await p.evaluate(()=>window.paymentResult);
            if(!result?.razorpay_payment_id||!result?.razorpay_order_id||!result?.razorpay_signature)throw Error('Incomplete checkout result: '+JSON.stringify(result));
            console.log('CHECKOUT RESULT: PASS');
            const v=await api('/api/v1/payments/verify',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${token}`},body:JSON.stringify({razorpay_order_id:result.razorpay_order_id,razorpay_payment_id:result.razorpay_payment_id,razorpay_signature:result.razorpay_signature})});
            if(v.status!=='captured')throw Error('Verification did not capture payment: '+JSON.stringify(v)); console.log('SIGNATURE VERIFICATION + CAPTURE: PASS');
            let row; for(let i=0;i<30;i++){const h=await api('/api/v1/payments/history',{headers:{authorization:`Bearer ${token}`}});row=h.payments.find(x=>x.provider_order_id===order.order_id);if(row?.status==='captured')break;await new Promise(r=>setTimeout(r,1000))}
            if(!row||row.status!=='captured'||row.provider_payment_id!==result.razorpay_payment_id)throw Error('Captured payment missing/mismatched in history'); console.log('PAYMENT HISTORY CAPTURED: PASS');
            const me=await api('/api/v1/account/me',{headers:{authorization:`Bearer ${token}`}}); if(me.plan_code!=='starter')throw Error('Plan upgrade missing'); console.log('PLAN UPGRADE: PASS');
            await b.close(); console.log('RAZORPAY FULL CHECKOUT E2E: PASS');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          cd /tmp/rzp
          python3 -m http.server 4173 >/tmp/rzp-server.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT
          node /tmp/rzp/test.js

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: razorpay-full-e2e-diagnostics
          path: /tmp/rzp/
          if-no-files-found: ignore
