name: Razorpay Full E2E Test
on:
  workflow_dispatch:
  push:
    branches: [just-scrapping]
    paths:
      - .github/workflows/razorpay-full-e2e.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://jobs.n8npi.live
      CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}

    steps:
      - name: Wait for backend
        run: |
          for i in {1..20}; do
            code=$(curl -sS --http1.1 --max-time 10 -o /tmp/health -w '%{http_code}' \
              "$BASE_URL/api/v1/health/database" || true)
            [ "$code" = "200" ] && cat /tmp/health && echo && exit 0
            echo "Health $i: HTTP $code"; sleep 3
          done; exit 1

      - name: API and webhook checks
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT

          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/login" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$CI_TEST_USER_EMAIL\",\"password\":\"$CI_TEST_USER_PASSWORD\"}")
          [ "$code" = "200" ] || { echo "Login HTTP $code"; cat "$TMP/login"; exit 1; }
          TOKEN=$(python3 -c "import json; print(json.load(open('$TMP/login'))['session']['access_token'])")

          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/order" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/orders" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"plan_code":"starter"}')
          [ "$code" = "200" ] || { echo "Order HTTP $code"; cat "$TMP/order"; exit 1; }

          python3 -c "
import json
d=json.load(open('$TMP/order'))
assert d['plan_code']=='starter' and d['amount_inr_paise']==29900 and d['currency']=='INR'
assert str(d['order_id']).startswith('order_') and str(d.get('razorpay_key_id','')).startswith('rzp_test_')
print('ORDER: PASS')
"
          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/wh -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/webhook" \
            -H 'Content-Type: application/json' -H 'X-Razorpay-Signature: full-e2e-badsig' \
            --data '{"id":"full-e2e-bad","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_bad","order_id":"order_bad"}}}}')
          [ "$code" = "400" ] || [ "$code" = "503" ] \
            || { echo "Webhook expected 400/503, got $code"; exit 1; }
          echo "INVALID WEBHOOK: PASS (HTTP $code)"

      - name: Install Playwright to /tmp
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Real Razorpay checkout via UPI success@razorpay
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rzp
          python3 -m http.server 4173 --directory /tmp/rzp >/tmp/rzp-server.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          node - <<'NODESCRIPT'
const {chromium}=require("/tmp/node_modules/playwright");
const fs=require("fs");
const BASE=process.env.BASE_URL, EMAIL=process.env.CI_TEST_USER_EMAIL, PASS=process.env.CI_TEST_USER_PASSWORD;
async function api(path,opts={}){const r=await fetch(BASE+path,opts),t=await r.text();let d;try{d=JSON.parse(t)}catch{d={_raw:t}}if(!r.ok)throw new Error(`${path}: HTTP ${r.status}\n${t.slice(0,400)}`);return d;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shot=async(page,n)=>{try{await page.screenshot({path:`/tmp/rzp/${n}.png`,fullPage:true})}catch{}};
async function findEl(page,sels,ms=20000){const end=Date.now()+ms;while(Date.now()<end){for(const f of page.frames())for(const s of sels){try{const e=f.locator(s).first();if(await e.count()&&await e.isVisible())return e;}catch{}}await page.waitForTimeout(400);}return null;}
async function findText(page,txt,ms=20000){const end=Date.now()+ms;while(Date.now()<end){for(const f of page.frames()){try{const e=f.getByText(txt,{exact:true}).first();if(await e.count()&&await e.isVisible())return e;}catch{}}await page.waitForTimeout(400);}return null;}
async function findBtn(page,re,ms=8000){const end=Date.now()+ms;while(Date.now()<end){for(const f of page.frames()){try{const e=f.getByRole("button",{name:re}).last();if(await e.count()&&await e.isVisible())return e;}catch{}}await page.waitForTimeout(400);}return null;}

(async()=>{
  const login=await api("/api/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:EMAIL,password:PASS})});
  const token=login?.session?.access_token; if(!token) throw new Error("No token");
  const order=await api("/api/v1/payments/orders",{method:"POST",headers:{"content-type":"application/json",authorization:`Bearer ${token}`},body:JSON.stringify({plan_code:"starter"})});

  fs.writeFileSync("/tmp/rzp/index.html",`<!doctype html><html><head><meta charset="utf-8"></head><body><button id="pay">Pay</button><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>var rzp=new Razorpay({key:${JSON.stringify(order.razorpay_key_id)},amount:${order.amount_inr_paise},currency:"INR",name:"Job Finder Test",description:"Full E2E",order_id:${JSON.stringify(order.order_id)},prefill:{name:"CI Test",email:${JSON.stringify(EMAIL)},contact:"9999999999"},handler:function(r){window.paymentResult=r;},modal:{ondismiss:function(){window.paymentDismissed=true;}}});document.getElementById("pay").onclick=function(){rzp.open();};</script></body></html>`);

  const b=await chromium.launch({headless:true,args:["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]});
  const p=await b.newPage({viewport:{width:1280,height:900}});
  p.on("console",m=>{if(m.type()==="error")console.log("[browser-err]",m.text().slice(0,150));});
  let result;
  try{
    await p.goto("http://127.0.0.1:4173/index.html");
    await p.waitForLoadState("networkidle");
    await p.getByRole("button",{name:"Pay"}).click();
    console.log("Pay clicked");
    await sleep(4000); await shot(p,"01-after-pay");
    console.log("Frames:",p.frames().map(f=>f.url().slice(0,80)).join(" | "));

    const mobile=await findEl(p,['input[placeholder="Mobile number"]','input[placeholder*="mobile" i]','input[type="tel"]'],30000);
    if(mobile){console.log("Mobile found");await mobile.fill("9999999999");const cont=await findBtn(p,/continue/i,5000);if(!cont)throw new Error("No Continue");await cont.click({timeout:3000});await sleep(2000);}
    else{console.log("No mobile field");}
    await shot(p,"02-after-mobile");
    console.log("Frames:",p.frames().map(f=>f.url().slice(0,80)).join(" | "));

    const upiTab=await findText(p,"UPI",20000);
    if(!upiTab){await shot(p,"03-no-upi");throw new Error("UPI tab not found");}
    console.log("UPI tab found, clicking...");
    await upiTab.click({timeout:3000}); await sleep(1500); await shot(p,"03-after-upi");

    const upiInput=await findEl(p,['input[placeholder*="UPI" i]','input[placeholder*="VPA" i]','input[name*="vpa" i]','input[name*="upi" i]'],20000);
    if(!upiInput){await shot(p,"04-no-input");throw new Error("UPI input not found");}
    console.log("Filling success@razorpay...");
    await upiInput.fill("success@razorpay"); await shot(p,"04-filled");

    const payBtn=await findBtn(p,/verify\s*and\s*pay/i,3000)||await findBtn(p,/pay\s*now/i,3000)||await findBtn(p,/^pay$/i,5000)||await findBtn(p,/pay/i,5000);
    if(!payBtn){await shot(p,"05-no-pay");throw new Error("Pay button not found");}
    console.log("Clicking Pay...");
    await payBtn.click({timeout:3000}); await shot(p,"05-after-pay");

    console.log("Waiting for payment result (60s)...");
    await p.waitForFunction(()=>!!window.paymentResult,null,{timeout:60000});
    result=await p.evaluate(()=>window.paymentResult);
    if(!result?.razorpay_payment_id||!result?.razorpay_order_id||!result?.razorpay_signature){await shot(p,"06-bad");throw new Error("Incomplete: "+JSON.stringify(result));}
    console.log("CHECKOUT RESULT: PASS",result.razorpay_payment_id);
  }finally{await b.close().catch(()=>{});}

  const v=await api("/api/v1/payments/verify",{method:"POST",headers:{"content-type":"application/json",authorization:`Bearer ${token}`},body:JSON.stringify({razorpay_order_id:result.razorpay_order_id,razorpay_payment_id:result.razorpay_payment_id,razorpay_signature:result.razorpay_signature})});
  if(v.status!=="captured")throw new Error("/verify: "+v.status);
  console.log("SIGNATURE VERIFICATION: PASS");

  let histRow=null;
  for(let i=0;i<30;i++){const h=await api("/api/v1/payments/history",{headers:{authorization:`Bearer ${token}`}});histRow=(h.payments||[]).find(p=>p.provider_order_id===order.order_id);if(histRow&&histRow.status==="captured")break;await sleep(1000);}
  if(!histRow||histRow.status!=="captured")throw new Error("History: "+JSON.stringify(histRow));
  console.log("PAYMENT HISTORY CAPTURED: PASS");

  const me=await api("/api/v1/account/me",{headers:{authorization:`Bearer ${token}`}});
  const planCode=me?.user?.plan_code;
  if(planCode!=="starter")throw new Error("Plan: "+planCode);
  console.log("PLAN UPGRADE: PASS");
  console.log("\nRAZORPAY FULL CHECKOUT E2E: PASS");
})().catch(e=>{console.error("FAILED:",e.stack||String(e));process.exit(1);});
NODESCRIPT

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: razorpay-full-e2e-screenshots
          path: /tmp/rzp/*.png
          if-no-files-found: ignore
