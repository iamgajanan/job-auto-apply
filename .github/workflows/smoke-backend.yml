name: Backend Smoke Tests

on:
  push:
    branches:
      - just-scrapping
  workflow_dispatch:

concurrency:
  group: job-auto-apply-backend-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: API auth and authorization smoke tests
    runs-on: [self-hosted, linux, arm64]
    env:
      BASE_URL: http://127.0.0.1:8004
      APP_DIR: /home/iamgajanan/Projects/job-auto-apply
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Wait for this commit to be deployed
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in {1..60}; do
            current_sha="$(git -C "$APP_DIR" rev-parse HEAD 2>/dev/null || true)"
            if [ "$current_sha" = "$GITHUB_SHA" ] && curl -fsS --max-time 3 "$BASE_URL/" >/tmp/job-auto-apply-smoke-health.json; then
              cat /tmp/job-auto-apply-smoke-health.json
              echo "deployed commit: $current_sha"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: deployment did not reach commit $GITHUB_SHA"
          git -C "$APP_DIR" rev-parse HEAD || true
          exit 1

      - name: Run API smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail

          VENV="$APP_DIR/backend/.venv/bin"
          test -x "$VENV/python" || { echo "ERROR: backend virtualenv not found"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "ERROR: SUPABASE_DB_URL is not configured"; exit 1; }

          TMP_DIR="$(mktemp -d)"
          TEST_EMAIL="ci-auth-$(date +%s)-$RANDOM@example.com"
          TEST_PASSWORD="TestPassword123!"
          NEW_PASSWORD="NewTestPassword123!"

          export SMOKE_TEST_EMAIL="$TEST_EMAIL"
          export SMOKE_TEST_DB_URL="$SUPABASE_DB_URL"

          cleanup() {
            "$VENV/python" - <<'PY' || true
          import os
          import psycopg

          email = os.environ.get("SMOKE_TEST_EMAIL")
          if not email:
              raise SystemExit
          with psycopg.connect(os.environ["SMOKE_TEST_DB_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("delete from auth.users where lower(email) = lower(%s)", (email,))
                  cursor.execute("delete from public.admin_allowlist where lower(email) = lower(%s)", (email,))
              connection.commit()
          PY
            rm -rf "$TMP_DIR"
          }
          trap cleanup EXIT

          assert_status() {
            expected="$1"
            actual="$2"
            body="$3"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: expected HTTP $expected, got $actual"
              cat "$body" || true
              exit 1
            fi
          }

          echo "[1] database health"
          status=$(curl -sS -o "$TMP_DIR/db.json" -w '%{http_code}' "$BASE_URL/api/v1/health/database")
          assert_status 200 "$status" "$TMP_DIR/db.json"

          echo "[2] public plans"
          status=$(curl -sS -o "$TMP_DIR/plans.json" -w '%{http_code}' "$BASE_URL/api/v1/plans")
          assert_status 200 "$status" "$TMP_DIR/plans.json"
          "$VENV/python" - "$TMP_DIR/plans.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert len(data["plans"]) == 5, data
          assert data["plans"][0]["code"] == "free", data
          print("plans: PASS")
          PY

          echo "[3] missing and invalid authentication"
          status=$(curl -sS -o "$TMP_DIR/no-token.json" -w '%{http_code}' "$BASE_URL/api/v1/auth/me")
          assert_status 401 "$status" "$TMP_DIR/no-token.json"
          status=$(curl -sS -o "$TMP_DIR/fake-token.json" -w '%{http_code}' \
            -H 'Authorization: Bearer invalid-token' "$BASE_URL/api/v1/auth/me")
          assert_status 401 "$status" "$TMP_DIR/fake-token.json"
          status=$(curl -sS -o "$TMP_DIR/admin-no-token.json" -w '%{http_code}' "$BASE_URL/api/v1/admin/users")
          assert_status 401 "$status" "$TMP_DIR/admin-no-token.json"
          status=$(curl -sS -o "$TMP_DIR/account-no-token.json" -w '%{http_code}' "$BASE_URL/api/v1/account/me")
          assert_status 401 "$status" "$TMP_DIR/account-no-token.json"

          echo "[4] protected job endpoint"
          status=$(curl -sS -o "$TMP_DIR/jobs-no-token.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/jobs/search" \
            -H 'Content-Type: application/json' \
            --data '{"platform":"naukri","job_title":"react","location":"pune","experience":"5 years","work_mode":"any","posted_within":"day","easy_apply":false}')
          assert_status 401 "$status" "$TMP_DIR/jobs-no-token.json"

          echo "[5] signup reaches Supabase Auth"
          status=$(curl -sS -o "$TMP_DIR/signup.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/signup" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\",\"full_name\":\"CI Auth Test\"}")

          if [ "$status" = "201" ]; then
            echo "signup: PASS (201)"
            USER_ID=$("$VENV/python" - "$TMP_DIR/signup.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["user"]["id"])
          PY
            )
            export SMOKE_TEST_USER_ID="$USER_ID"

            "$VENV/python" - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["SMOKE_TEST_DB_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select p.role, p.status, p.plan_code,
                             coalesce(sum(qa.granted_searches), 0),
                             coalesce(sum(qa.used_searches), 0)
                      from public.profiles p
                      left join public.quota_allocations qa on qa.user_id = p.id
                      where p.id = %s
                      group by p.id
                      """,
                      (os.environ["SMOKE_TEST_USER_ID"],),
                  )
                  row = cursor.fetchone()
                  assert row == ("user", "active", "free", 50, 0), row
                  cursor.execute(
                      "update auth.users set email_confirmed_at = coalesce(email_confirmed_at, timezone('utc', now())) where id = %s",
                      (os.environ["SMOKE_TEST_USER_ID"],),
                  )
              connection.commit()
          print("profile/quota bootstrap: PASS")
          PY

            echo "[6] successful login and current user"
            status=$(curl -sS -o "$TMP_DIR/login.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}")
            assert_status 200 "$status" "$TMP_DIR/login.json"
            ACCESS_TOKEN=$("$VENV/python" - "$TMP_DIR/login.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["session"]["access_token"])
          PY
            )
            REFRESH_TOKEN=$("$VENV/python" - "$TMP_DIR/login.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["session"]["refresh_token"])
          PY
            )

            status=$(curl -sS -o "$TMP_DIR/me.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE_URL/api/v1/auth/me")
            assert_status 200 "$status" "$TMP_DIR/me.json"

            echo "[7] account/quota"
            status=$(curl -sS -o "$TMP_DIR/account.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE_URL/api/v1/account/me")
            assert_status 200 "$status" "$TMP_DIR/account.json"
            "$VENV/python" - "$TMP_DIR/account.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["usage"]["remaining_searches"] == 50, data
          print("account/quota: PASS")
          PY

            echo "[8] normal-user admin denial"
            status=$(curl -sS -o "$TMP_DIR/admin-user.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE_URL/api/v1/admin/users")
            assert_status 403 "$status" "$TMP_DIR/admin-user.json"

            echo "[9] refresh"
            status=$(curl -sS -o "$TMP_DIR/refresh.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/v1/auth/refresh" \
              -H 'Content-Type: application/json' \
              --data "{\"refresh_token\":\"$REFRESH_TOKEN\"}")
            assert_status 200 "$status" "$TMP_DIR/refresh.json"

            echo "[10] password update and re-login"
            status=$(curl -sS -o "$TMP_DIR/password.json" -w '%{http_code}' \
              -X PUT "$BASE_URL/api/v1/auth/password" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"password\":\"$NEW_PASSWORD\"}")
            assert_status 204 "$status" "$TMP_DIR/password.json"
            status=$(curl -sS -o "$TMP_DIR/new-login.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$NEW_PASSWORD\"}")
            assert_status 200 "$status" "$TMP_DIR/new-login.json"
            ACCESS_TOKEN=$("$VENV/python" - "$TMP_DIR/new-login.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["session"]["access_token"])
          PY
            )
            REFRESH_TOKEN=$("$VENV/python" - "$TMP_DIR/new-login.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["session"]["refresh_token"])
          PY
            )

            echo "[11] admin allowlist promotion"
            "$VENV/python" - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["SMOKE_TEST_DB_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("insert into public.admin_allowlist(email, is_active) values (%s, true) on conflict (email) do update set is_active=true", (os.environ["SMOKE_TEST_EMAIL"],))
              connection.commit()
          PY
            status=$(curl -sS -o "$TMP_DIR/admin.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE_URL/api/v1/admin/users")
            assert_status 200 "$status" "$TMP_DIR/admin.json"

            echo "[12] logout and refresh-token revocation"
            status=$(curl -sS -o "$TMP_DIR/logout.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE_URL/api/v1/auth/logout")
            assert_status 204 "$status" "$TMP_DIR/logout.json"
            status=$(curl -sS -o "$TMP_DIR/revoked-refresh.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/v1/auth/refresh" \
              -H 'Content-Type: application/json' \
              --data "{\"refresh_token\":\"$REFRESH_TOKEN\"}")
            if [ "$status" -lt 400 ]; then
              echo "ERROR: refresh token remained valid after logout"
              cat "$TMP_DIR/revoked-refresh.json"
              exit 1
            fi
          elif [ "$status" = "429" ]; then
            echo "signup: reached Supabase Auth but email provider rate limit is active (429); successful-session branch skipped"
            cat "$TMP_DIR/signup.json"
          else
            echo "ERROR: signup returned unexpected HTTP $status"
            cat "$TMP_DIR/signup.json"
            exit 1
          fi

          echo "[final] invalid refresh/password/logout and generic reset"
          status=$(curl -sS -o "$TMP_DIR/refresh-invalid.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/refresh" \
            -H 'Content-Type: application/json' \
            --data '{"refresh_token":"invalid-refresh-token-value-123456"}')
          if [ "$status" -lt 400 ]; then
            echo "ERROR: invalid refresh token unexpectedly succeeded"
            exit 1
          fi

          status=$(curl -sS -o "$TMP_DIR/password-invalid.json" -w '%{http_code}' \
            -X PUT "$BASE_URL/api/v1/auth/password" \
            -H 'Authorization: Bearer invalid-token' \
            -H 'Content-Type: application/json' \
            --data '{"password":"AnotherPassword123!"}')
          assert_status 401 "$status" "$TMP_DIR/password-invalid.json"

          status=$(curl -sS -o "$TMP_DIR/logout-invalid.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/logout" \
            -H 'Authorization: Bearer invalid-token')
          assert_status 401 "$status" "$TMP_DIR/logout-invalid.json"

          status=$(curl -sS -o "$TMP_DIR/reset.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/password-reset" \
            -H 'Content-Type: application/json' \
            --data '{"email":"nobody-ci@example.com"}')
          assert_status 202 "$status" "$TMP_DIR/reset.json"

          echo "BACKEND API SMOKE TESTS: PASS"
