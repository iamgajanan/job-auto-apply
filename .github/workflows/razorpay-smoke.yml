name: Razorpay Backend Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [just-scrapping]
    paths:
      - .github/workflows/razorpay-smoke.yml

jobs:
  razorpay-smoke:
    name: Razorpay order and webhook smoke test
    runs-on: ubuntu-latest
    env:
      CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}
      BASE_URL: https://jobs.n8npi.live

    steps:
      - name: Wait for backend
        run: |
          for i in {1..20}; do
            code=$(curl -sS --http1.1 --max-time 10 -o /tmp/health -w '%{http_code}' \
              "$BASE_URL/api/v1/health/database" || true)
            if [ "$code" = "200" ]; then cat /tmp/health; echo; exit 0; fi
            echo "Health $i: HTTP $code"; sleep 3
          done
          exit 1

      - name: Login and create Razorpay test order
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT

          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/login" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$CI_TEST_USER_EMAIL\",\"password\":\"$CI_TEST_USER_PASSWORD\"}")
          [ "$code" = "200" ] || { echo "Login failed: HTTP $code"; cat "$TMP/login"; exit 1; }

          TOKEN=$(python3 - "$TMP/login" <<'PY'
          import json,sys; print(json.load(open(sys.argv[1]))['session']['access_token'])
          PY
          )
          [ -n "$TOKEN" ]

          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/order" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/orders" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"plan_code":"starter"}')
          [ "$code" = "200" ] || { echo "Order failed: HTTP $code"; cat "$TMP/order"; exit 1; }

          python3 - "$TMP/order" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['plan_code']=='starter',                         f"plan_code wrong: {d}"
          assert d['amount_inr_paise']==29900,                     f"amount wrong: {d}"
          assert d['currency']=='INR',                             f"currency wrong: {d}"
          assert d['order_id'].startswith('order_'),               f"order_id bad: {d}"
          assert d.get('razorpay_key_id','').startswith('rzp_test_'), f"key_id bad: {d}"
          print('ORDER CREATION: PASS')
          print('order_id:', d['order_id'])
          PY

          ORDER_ID=$(python3 - "$TMP/order" <<'PY'
          import json,sys; print(json.load(open(sys.argv[1]))['order_id'])
          PY
          )

          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/history" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/api/v1/payments/history")
          [ "$code" = "200" ] || { echo "History failed: HTTP $code"; cat "$TMP/history"; exit 1; }

          python3 - "$TMP/history" "$ORDER_ID" <<'PY'
          import json,sys
          history=json.load(open(sys.argv[1]))
          order_id=sys.argv[2]
          rows=history.get('payments',[])
          match=[r for r in rows if r.get('provider_order_id')==order_id and r.get('status')=='created']
          assert match, f"Order {order_id} not found as created in history: {rows[:3]}"
          print('PAYMENT HISTORY PERSISTENCE: PASS')
          PY

      - name: Verify webhook rejects invalid signature
        run: |
          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/wh -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/webhook" \
            -H 'Content-Type: application/json' \
            -H 'X-Razorpay-Signature: invalid-smoke-sig' \
            --data '{"id":"smoke_invalid","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_smoke","order_id":"order_smoke"}}}}')
          [ "$code" = "400" ] || { echo "Expected 400, got $code"; cat /tmp/wh; exit 1; }
          echo 'WEBHOOK SIGNATURE REJECTION: PASS'
