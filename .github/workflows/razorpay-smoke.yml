name: Razorpay Backend Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [just-scrapping]
    paths:
      - .github/workflows/razorpay-smoke.yml

jobs:
  razorpay-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jobs.n8npi.live
      CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}

    steps:
      - name: Wait for backend
        run: |
          for i in {1..20}; do
            code=$(curl -sS --http1.1 --max-time 10 -o /tmp/health -w '%{http_code}' \
              "$BASE_URL/api/v1/health/database" || true)
            [ "$code" = "200" ] && cat /tmp/health && echo && exit 0
            echo "Health $i: HTTP $code"; sleep 5
          done; exit 1

      - name: Signup a fresh test user
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
          EMAIL="ci-$(date +%s)-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CiTest!$(date +%s)Aa1"
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/signup" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/signup" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"full_name\":\"CI Smoke User\"}")
          [ "$code" = "201" ] || { echo "Signup HTTP $code:"; cat "$TMP/signup"; exit 1; }
          python3 -c "
import json
x=json.load(open('$TMP/signup'))
assert x.get('user',{}).get('email','').lower() == '$EMAIL'.lower(), x
assert x.get('user',{}).get('id'), x
print('SIGNUP: PASS')
print('EMAIL_CONFIRMATION_REQUIRED:', x.get('email_confirmation_required'))
"

      - name: Login, create order, check history
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT

          # Login
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/login" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$CI_TEST_USER_EMAIL\",\"password\":\"$CI_TEST_USER_PASSWORD\"}")
          [ "$code" = "200" ] || { echo "Login HTTP $code:"; cat "$TMP/login"; exit 1; }

          python3 -c "
import json
x=json.load(open('$TMP/login'))
assert x.get('session',{}).get('access_token'), x
assert x.get('user',{}).get('id'), x
print('LOGIN: PASS')
"
          TOKEN=$(python3 -c "import json; print(json.load(open('$TMP/login'))['session']['access_token'])")

          # Current user
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/me" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE_URL/api/v1/auth/me")
          [ "$code" = "200" ] || { echo "Auth /me HTTP $code:"; cat "$TMP/me"; exit 1; }
          python3 -c "import json; x=json.load(open('$TMP/me')); assert x.get('id'), x; print('AUTH ME: PASS')"

          # Create order
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/order" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/orders" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"plan_code":"starter"}')
          [ "$code" = "200" ] || { echo "Order HTTP $code:"; cat "$TMP/order"; exit 1; }

          python3 -c "
import json
d = json.load(open('$TMP/order'))
assert d['plan_code'] == 'starter', d
assert d['amount_inr_paise'] == 29900, d
assert d['currency'] == 'INR', d
assert str(d['order_id']).startswith('order_'), d
assert str(d.get('razorpay_key_id','')).startswith('rzp_test_'), d
print('ORDER CREATION: PASS  order_id=' + d['order_id'])
"
          ORDER_ID=$(python3 -c "import json; print(json.load(open('$TMP/order'))['order_id'])")

          # Check history
          code=$(curl -sS --http1.1 --max-time 30 -o "$TMP/history" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE_URL/api/v1/payments/history")
          [ "$code" = "200" ] || { echo "History HTTP $code:"; cat "$TMP/history"; exit 1; }
          python3 -c "
import json
rows = json.load(open('$TMP/history')).get('payments', [])
match = [r for r in rows if r.get('provider_order_id') == '$ORDER_ID' and r.get('status') == 'created']
assert match, f'Order not found as created in history (checked {len(rows)} rows)'
print('PAYMENT HISTORY PERSISTENCE: PASS')
"

          # Persist token for the next job step through GitHub environment file.
          echo "SMOKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Search jobs with authenticated user
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
          code=$(curl -sS --http1.1 --max-time 120 -o "$TMP/jobs" -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/jobs/search" \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"platform":"linkedin","job_title":"React Developer","location":"Pune","experience":"5 years","work_mode":"any","posted_within":"day","easy_apply":false}')
          echo "Job search HTTP: $code"
          [ "$code" = "200" ] || { cat "$TMP/jobs"; exit 1; }
          python3 -c "
import json
x=json.load(open('$TMP/jobs'))
assert isinstance(x.get('jobs'), list), x
print('JOB SEARCH: PASS  results=' + str(len(x['jobs'])))
"

      - name: Webhook rejects invalid signature
        run: |
          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/wh -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/webhook" \
            -H 'Content-Type: application/json' \
            -H 'X-Razorpay-Signature: smoke-invalid-sig' \
            --data '{"id":"smoke-bad","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_bad","order_id":"order_bad"}}}}')
          echo "Webhook response: HTTP $code  body: $(cat /tmp/wh)"
          [ "$code" = "400" ] && echo "WEBHOOK INVALID SIG REJECTION: PASS (HTTP 400)" && exit 0
          [ "$code" = "503" ] && echo "WEBHOOK ENDPOINT LIVE: PASS (HTTP 503 - secret not configured)" && exit 0
          echo "FAIL: unexpected HTTP $code"; exit 1
