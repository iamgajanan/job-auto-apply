name: RZP Final Checkout
on:
  workflow_dispatch:
  push:
    branches:
      - just-scrapping
    paths:
      - .github/workflows/rzp-final.yml
      - razorpay-e2e-runner.js
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://jobs.n8npi.live
      EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}
    steps:
      - name: Health
        run: curl -fsS --http1.1 "$BASE_URL/api/v1/health/database"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Run Razorpay E2E
        run: node razorpay-e2e-runner.js
