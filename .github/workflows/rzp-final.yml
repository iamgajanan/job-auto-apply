name: RZP Final Checkout
on:
  workflow_dispatch:
  push:
    branches: [just-scrapping]
    paths:
      - .github/workflows/rzp-final.yml
      - razorpay-e2e-runner.js

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://jobs.n8npi.live
      CI_TEST_USER_EMAIL: ${{ secrets.CI_TEST_USER_EMAIL }}
      CI_TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD }}

    steps:
      - name: Backend health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS --http1.1 --max-time 10 -o /tmp/health -w '%{http_code}' \
              "$BASE_URL/api/v1/health/database" || true)
            [ "$code" = "200" ] && cat /tmp/health && echo && exit 0
            echo "Health $i: HTTP $code"; sleep 3
          done
          echo "Backend unhealthy"; exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets and API reachable
        run: |
          echo "EMAIL set: $([ -n "$CI_TEST_USER_EMAIL" ] && echo YES || echo NO)"
          echo "PASS set:  $([ -n "$CI_TEST_USER_PASSWORD" ] && echo YES || echo NO)"
          [ -n "$CI_TEST_USER_EMAIL" ] && [ -n "$CI_TEST_USER_PASSWORD" ] || { echo "SECRETS MISSING"; exit 1; }

          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$CI_TEST_USER_EMAIL\",\"password\":\"$CI_TEST_USER_PASSWORD\"}")
          echo "Login HTTP: $code"
          [ "$code" = "200" ] || { cat /tmp/login.json; exit 1; }

          TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/login.json'))['session']['access_token'])")
          echo "Token obtained: ${TOKEN:0:20}..."

          code=$(curl -sS --http1.1 --max-time 30 -o /tmp/order.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/orders" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"plan_code":"starter"}')
          echo "Order HTTP: $code  body: $(cat /tmp/order.json)"
          [ "$code" = "200" ] || exit 1

          wh_code=$(curl -sS --http1.1 --max-time 30 -o /tmp/wh.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/payments/webhook" \
            -H 'Content-Type: application/json' \
            -H 'X-Razorpay-Signature: bad-sig-preflight' \
            --data '{"id":"preflight-bad","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_bad","order_id":"order_bad"}}}}')
          echo "Webhook HTTP: $wh_code  body: $(cat /tmp/wh.json)"
          [ "$wh_code" = "400" ] || [ "$wh_code" = "503" ] || { echo "Unexpected webhook code $wh_code"; exit 1; }
          echo "All pre-flight checks passed"

      - name: Install Playwright to /tmp
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Start HTTP server (serves /tmp/rzp for checkout page)
        run: |
          mkdir -p /tmp/rzp
          echo "<html><body>ready</body></html>" > /tmp/rzp/index.html
          cd /tmp/rzp
          python3 -m http.server 4173 >/tmp/rzp-server.log 2>&1 &
          echo $! > /tmp/rzp-server.pid
          sleep 2
          curl -sf http://127.0.0.1:4173/index.html >/dev/null && echo "HTTP server OK on port 4173"

      - name: Run Razorpay Final E2E
        run: node razorpay-e2e-runner.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rzp-final-screenshots
          path: /tmp/rzp/*.png
          if-no-files-found: ignore

      - name: Stop HTTP server
        if: always()
        run: kill $(cat /tmp/rzp-server.pid 2>/dev/null) 2>/dev/null || true
